# 构建并发布镜像到 GHCR。
# main 及版本标签会发布镜像；Pull Request 只执行构建，不推送任何镜像。
name: docker-publish

on:
  push:
    branches: [main]
    # v* tag 的发版构建在 docker-release.yml（独立于 paths 过滤，见其文件头注释）
    paths:
      - "cmd/**"
      - "internal/**"
      - "frontend/**"
      - "public/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "frontend/**"
      - "public/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            # 保留 v 前缀：镜像 tag 与 git tag、spore version 输出三者同名，
            # 运维手册的“固定到 vX.Y.Z 标签”即指此
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # 注入 spore version：tag 构建（release-please 合并后触发）传版本号，
          # main/PR 构建传 commit SHA，与镜像 tag 的命名口径一致
          build-args: |
            SPORE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
