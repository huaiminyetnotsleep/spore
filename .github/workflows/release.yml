# 发版自动化（release-please）：分析 main 上的 Conventional Commits，自动
# 维护版本号与 CHANGELOG，以一个 release PR 呈现；合并该 PR 即创建 tag 与
# GitHub Release，随后派发 repository_dispatch 触发 docker-release.yml 发出
# 对应版本镜像。
#
# 版本递增规则：fix → 修订号（v1.0.1）；feat → 次版本（v1.1.0）；
# feat!/BREAKING CHANGE → 主版本（v2.0.0）；docs/style/chore 不触发发版。
# 直接 push 到 main 的提交无需额外操作——它们会自动累积进下一个 release PR，
# 不想发版就不合并该 PR。
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# 连续 push main 时串行执行：release-please 会读写同一个 release PR，
# 两个运行重叠可能竞态（重复分析/互相覆盖 PR 内容）
concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 维护 release PR 与版本号
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN 创建的 tag 其 push 事件不会触发其他 workflow（GitHub 防循环
  # 规则），镜像构建必须经 repository_dispatch 中转——这是官方豁免的两种
  # 事件之一，由它接续触发 docker-release.yml。
  release-image:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 通知 docker-release 构建发版镜像
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=release-image \
            -F "client_payload[tag]=$TAG"
