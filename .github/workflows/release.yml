# 发版自动化（release-please）：分析 main 上的 Conventional Commits，自动
# 维护版本号与 CHANGELOG，以一个 release PR 呈现；合并该 PR 即创建 tag 与
# GitHub Release，随后派发 repository_dispatch 接续触发 docker-release.yml
# 发出对应版本镜像、docs-release.yml 部署对应版本文档。
#
# 版本递增规则：fix → 修订号（v1.0.1）；feat → 次版本（v1.1.0）；
# feat!/BREAKING CHANGE → 主版本（v2.0.0）；docs/style/chore 不触发发版。
# 直接 push 到 main 的提交无需额外操作——它们会自动累积进下一个 release PR，
# 不想发版就不合并该 PR。
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# 连续 push main 时串行执行：release-please 会读写同一个 release PR，
# 两个运行重叠可能竞态（重复分析/互相覆盖 PR 内容）
concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 维护 release PR 与版本号
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN 创建的 PR 不会触发 pull_request workflow（GitHub 防循环
      # 规则），两项 required check 在 release PR 上永远等不到状态、会一直卡
      # 在 Expected。这里按与 build-check 相同的路径判定预填状态：release PR
      # 只含 CHANGELOG（release-please 无 extra-files）→ 两项均判定"不影响"
      # 并标记 success，合并门禁随即放行。若未来 release PR 含真正影响镜像
      # 或文档的文件，则不预填——由维护者向 release 分支推一个空提交（人工
      # push 会触发真实 CI）后再合并。
      - name: 预填 release PR 门禁状态（bot PR 不触发 CI）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本 job 无 checkout，必须用纯 gh api（gh pr list/diff 会调用本地
          # git 而失败）。仓库路径取 GITHUB_REPOSITORY，显式指定。
          repo="$GITHUB_REPOSITORY"
          pr=$(gh api "repos/$repo/pulls?state=open&base=main&per_page=50" \
            --jq '.[]
              | select(.user.login == "github-actions[bot]"
                and (.title | startswith("chore(main): release")))
              | "\(.number) \(.head.sha)"' \
            | head -1)
          if [ -z "$pr" ]; then
            echo "没有打开的 release PR，跳过"
            exit 0
          fi
          num=${pr%% *}
          sha=${pr##* }
          echo "release PR #$num (head $sha)"
          files=$(gh api "repos/$repo/pulls/$num/files?per_page=100" \
            --paginate --jq '.[].filename')
          echo "$files" | sed 's/^/  变更文件: /'
          if echo "$files" | grep -qE '^(cmd/|internal/|frontend/|public/|go\.mod$|go\.sum$|Makefile$|Dockerfile$|\.dockerignore$|\.github/workflows/docker-.*\.yml$)'; then
            echo "检测到影响镜像的变更，不预填 docker 门禁状态（需人工推空提交触发真实 CI）"
          else
            gh api -X POST "repos/$repo/statuses/$sha" \
              -f state=success -f context="docker-build-check / build-check" \
              -f description="CHANGELOG-only，不影响镜像，自动跳过" >/dev/null
            echo "docker 门禁状态已置 success"
          fi
          if echo "$files" | grep -qE '^(docs/|public/|\.github/workflows/docs-.*\.yml$)'; then
            echo "检测到影响文档站的变更，不预填 docs 门禁状态（需人工推空提交触发真实 CI）"
          else
            gh api -X POST "repos/$repo/statuses/$sha" \
              -f state=success -f context="docs-build-check / build-check" \
              -f description="CHANGELOG-only，不影响文档站，自动跳过" >/dev/null
            echo "docs 门禁状态已置 success"
          fi

  # GITHUB_TOKEN 创建的 tag 其 push 事件不会触发其他 workflow（GitHub 防循环
  # 规则），镜像与文档的发版构建必须经 repository_dispatch 中转——这是官方
  # 豁免的两种事件之一，由它接续触发 docker-release.yml 与 docs-release.yml。
  release-dispatch:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 通知 docker-release 构建发版镜像
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=release-image \
            -F "client_payload[tag]=$TAG"

      - name: 通知 docs-release 部署发版文档
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=release-docs \
            -F "client_payload[tag]=$TAG"
