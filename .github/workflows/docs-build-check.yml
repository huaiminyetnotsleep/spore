# 文档构建检查：验证 VitePress 站点可正常构建。
# 本 workflow 不部署——文档站只由发版部署（见 docs-release.yml），
# 与镜像保持同一节奏，保证线上文档始终来自有版本号的正式发布。
name: docs-build-check

on:
  # main 的合并提交与直接 push 都构建文档，防止绕过 PR 门禁后留下坏状态。
  push:
    branches: [main]
  # 合并到 main 前每个 PR 都构建文档；不设 paths，保证 required check
  # 始终产生状态。这里只验证 VitePress，不上传/部署 Pages。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一 PR/ref 的新提交取消旧构建，避免重复 npm ci / VitePress 构建。
concurrency:
  group: docs-build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      # Workflow 对每个 main PR/main push 都产生 required status；实际 VitePress
      # 构建只在文档源码、共享 public 资源或文档 workflow 变化时执行。
      - name: 检测文档相关变更
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'public/**'
              - '.github/workflows/docs-build-check.yml'
              - '.github/workflows/docs-release.yml'

      - name: 无文档相关变更，跳过构建
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.docs != 'true'
        run: echo "没有影响文档站的变更，required check 通过。"

      - name: 设置 Node.js
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 构建文档（不部署）
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.docs == 'true'
        working-directory: docs
        run: |
          npm ci
          npm run build
