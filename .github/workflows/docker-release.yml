# 发版镜像构建：项目的全部镜像都在这里产出——
#   版本标签 vX.Y.Z / vX.Y / vX，外加 latest 与 sha-<commit>（均随发版更新）。
# 两个触发来源，天然互斥不会重复构建：
#   1. repository_dispatch：release.yml 在 release-please 创建 tag 后派发
#      （GITHUB_TOKEN 创建的 tag 其 push 事件不会触发其他 workflow，见
#      release.yml 内注释）；payload.tag 指定要构建的 tag。
#   2. push tags v*：人工打/挪 tag 的兜底通道。
# 历史教训：版本镜像不能由带 paths 过滤的触发承担——paths 对 tag 推送同样
# 生效，发版合并只改 CHANGELOG.md 时构建会被跳过（v1.1.0 曾因此漏发）。
name: docker-release

on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [release-image]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # dispatch 事件的 github.ref 是默认分支而非 tag，版本号需从 payload 取；
      # 两种事件统一归一到目标 tag 后续步骤使用
      - name: 解析目标 tag
        id: ver
        env:
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ -n "$PAYLOAD_TAG" ]; then tag="$PAYLOAD_TAG"; else tag="${{ github.ref_name }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: 计算镜像标签（vX.Y.Z / vX.Y / vX / latest / sha-<commit>）
        id: meta
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          base="${TAG#v}"
          echo "minor=v${base%.*}" >> "$GITHUB_OUTPUT"
          echo "major=v${base%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            SPORE_VERSION=${{ steps.ver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
