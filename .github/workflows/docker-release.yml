# 正式发版构建：release-please 合并 release PR 时打的 vX.Y.Z tag 触发，
# 发布与 git tag 同名的镜像标签（vX.Y.Z / vX.Y / vX）。
#
# 为什么独立成文件且不带 paths 过滤：paths 对 tag 推送同样生效，若 tag
# 指向的变更集不含代码路径（发版合并通常只改 CHANGELOG.md），挂在
# docker-publish.yml 上的 tag 触发会被跳过，镜像漏发（v1.1.0 曾因此漏发）。
name: docker-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 保留 v 前缀：镜像 tag 与 git tag、spore version 输出三者同名
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
