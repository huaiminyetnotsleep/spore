<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Spore</title>
  <desc id="desc">Two paper planes with yellow spore bubbles.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#164985"/>
      <stop offset="1" stop-color="#04132f"/>
    </linearGradient>
    <linearGradient id="frontPlane" x1="26" y1="24" x2="53" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbe9ff"/>
    </linearGradient>
    <linearGradient id="copyPlane" x1="9" y1="24" x2="34" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5e6ff"/>
      <stop offset="1" stop-color="#6caee5"/>
    </linearGradient>
    <radialGradient id="bubble" cx="30%" cy="22%" r="82%">
      <stop stop-color="#fffbd1"/>
      <stop offset="0.25" stop-color="#fff176"/>
      <stop offset="0.72" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#e99a08"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <path d="M7 48C3 39 7 31 15 26c6-4 13-5 19-3" fill="none" stroke="#8ddcff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M10 29 34 17 26 40 21 34 16 38 17 30Z" fill="url(#copyPlane)" opacity="0.8"/>
  <path d="m17 30 17-13-14 17Z" fill="#4c91d2" opacity="0.9"/>
  <path d="M22 34 57 13 45 56 36 43 29 48 30 36Z" fill="#04122d" opacity="0.55" transform="translate(0 1.5)"/>
  <path d="M22 34 57 13 45 56 36 43 29 48 30 36Z" fill="url(#frontPlane)"/>
  <path d="m30 36 27-23-22 30Z" fill="#55a8ea"/>
  <path d="m36 43 9 13-3-16Z" fill="#a9d9ff"/>
  <!-- One large bubble with a cluster of smaller bubbles attached. -->
  <g stroke="#ffe36b" stroke-width="1.2">
    <circle cx="30.5" cy="28.8" r="5.9" fill="url(#bubble)"/>
    <circle cx="24.6" cy="27.2" r="2.6" fill="url(#bubble)"/>
    <circle cx="27.5" cy="34.1" r="2.3" fill="url(#bubble)"/>
    <circle cx="34.9" cy="34.3" r="3.2" fill="url(#bubble)"/>
    <circle cx="37.1" cy="26.1" r="2.25" fill="url(#bubble)"/>
    <circle cx="33.9" cy="22.3" r="1.55" fill="url(#bubble)"/>
    <circle cx="27.2" cy="22.7" r="1.8" fill="url(#bubble)"/>
    <circle cx="39.8" cy="30.1" r="1.45" fill="url(#bubble)"/>
    <circle cx="43.2" cy="40.2" r="4.35" fill="url(#bubble)"/>
    <circle cx="47.2" cy="38.3" r="1.9" fill="url(#bubble)"/>
    <circle cx="44.2" cy="45.2" r="1.8" fill="url(#bubble)"/>
  </g>
  <g fill="#ffffff">
    <ellipse cx="28.6" cy="26.7" rx="1.8" ry="1.1" opacity="0.9" transform="rotate(-25 28.6 26.7)"/>
    <ellipse cx="23.9" cy="26.4" rx="0.8" ry="0.5" opacity="0.85" transform="rotate(-25 23.9 26.4)"/>
    <circle cx="26.9" cy="33.4" r="0.55" opacity="0.8"/>
    <ellipse cx="43" cy="38.9" rx="1.3" ry="0.8" opacity="0.85" transform="rotate(-25 43 38.9)"/>
    <circle cx="46.8" cy="37.9" r="0.5" opacity="0.75"/>
  </g>
